[Language_en]
Name=Munition Markers
Description=Reveals unguided bombs, unguided aerial rockets and RBU contacts on the tactical map, acting as if they were ordinary contacts (shells, guided munitions and missiles/torpedoes are unaffected). Toggle each category and choose friend-only or both sides in the config. Requires AnchorChain.

[Language_cn]
Name=弹药标记
Description=在战术地图上显示原本被隐藏的非制导炸弹、无制导火箭弹以及反潜火箭深弹（RBU），把它们当作普通接触标绘（炮弹、制导弹药、导弹/鱼雷不受影响）。可在配置里分别开关各类弹药，并选择只显示己方或双方。需要 AnchorChain。

[Compatibility]
ApproximateVersion=0.8.2
